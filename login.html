<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Illusion → Intuition</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="auth-page">

    <header class="site-header">
        <nav class="navbar container">
            <a href="index.html" class="brand">
                <span class="brand-mark">I</span>
                <span>Illusion<span class="brand-arrow">→</span>Intuition</span>
            </a>

            <a href="index.html" class="nav-back">
                ← Back to home
            </a>
        </nav>
    </header>

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-header">
                <span class="brand-mark large">I</span>

                <span class="eyebrow">WELCOME BACK</span>

                <h1>Sign in to your account</h1>

                <p>
                    Continue exploring your saved experiences.
                </p>
            </div>

            <form id="loginForm" class="form">

                <div class="form-group">
                    <label for="email" class="form-label">
                        Email address
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        class="form-input"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <button type="button"
                                class="text-button"
                                id="togglePassword">
                            Show
                        </button>
                    </div>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        class="form-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="checkbox-row">
                    <label>
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>

                    <button type="button"
                            class="text-button"
                            id="forgotPassword">
                        Forgot password?
                    </button>
                </div>

                <button type="submit"
                        class="btn btn-primary btn-full">
                    Sign In
                </button>

            </form>

            <div class="auth-divider">
                <span>or</span>
            </div>

            <a href="account.html"
               class="btn btn-secondary btn-full">
                Continue as Guest
            </a>

            <p class="auth-footer">
                New here?
                <a href="account.html">Create an account</a>
            </p>

        </div>

    </main>

    <footer class="minimal-footer">
        © 2026 Illusion → Intuition
    </footer>

</body>
</html>
